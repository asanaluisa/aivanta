name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aivanta
          POSTGRES_PASSWORD: aivanta
          POSTGRES_DB: aivanta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aivanta" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      AIVANTA_TEST_DATABASE_URL: postgresql+psycopg://aivanta:aivanta@localhost:5432/aivanta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select E,F,W,B,I --ignore E501,B008 .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

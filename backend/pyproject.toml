[project]
name = "aivanta-backend"
version = "0.1.0"
description = "Aivanta — AI business value and ROI intelligence platform (API + core engine)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "api: requires the web stack (FastAPI, SQLAlchemy) installed",
  "postgres: requires a reachable PostgreSQL database (AIVANTA_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
